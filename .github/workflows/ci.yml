name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caribpay
          POSTGRES_PASSWORD: caribpay
          POSTGRES_DB: caribpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caribpay -d caribpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://caribpay:caribpay@localhost:5432/caribpay
      BANK_DATABASE_URL: postgresql://caribpay:caribpay@localhost:5432/caribpay_bank
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `latest`: the lockfile is installed with --frozen-lockfile,
      # and a Bun release that changes the lockfile format would fail the build
      # on a commit that never changed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The service container only creates POSTGRES_DB, so the bank's
      # database and both test databases are created here.
      - name: Create databases
        run: |
          for db in caribpay_bank caribpay_test caribpay_bank_test; do
            PGPASSWORD=caribpay createdb -h localhost -U caribpay "$db"
          done
      - run: bun run typecheck
      - run: bun test
