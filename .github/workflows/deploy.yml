name: Deploy

# Deploys to the Ubuntu VPS on a push to main, after CI passes. Configure these
# repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, and VPS_APP_DIR (the path
# to the checked-out repo on the server, e.g. /home/deploy/caribpay).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:$PATH"
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only origin main
            bun install --frozen-lockfile
            bun run db:migrate
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save
